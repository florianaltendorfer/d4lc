[package]
name = "d4lc-overlay-x11"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
real-x11 = ["dep:x11rb"]

[dependencies]
d4lc-core = { path = "../d4lc-core" }
d4lc-rules = { path = "../d4lc-rules" }
# Shared bounded overlay-text path (`src/text.rs`): `fontdb`
# resolves the explicit font assignment from the system font database and
# `swash` rasterizes glyph outlines with a reusable scaling context. Both were
# already in the workspace lock through the Slint text stack and are
# MIT / Apache-2.0 OR MIT — see `licenses/README.md` for the font and
# packaging note. `fontdb` is used with `fs` only: no mmap and no fontconfig
# parsing, so the feature union stays the one the Slint stack already builds.
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
swash = "0.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "render", "shape", "xtest"], optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unsafe_code = "deny"
