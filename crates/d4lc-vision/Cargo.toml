[package]
name = "d4lc-vision"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
d4lc-core = { path = "../d4lc-core" }

[dev-dependencies]
# d4lc code only reads and writes PNG, so it requests no other codec.
# Slint still enables `jpeg` on the shared `image` crate in the app build.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
