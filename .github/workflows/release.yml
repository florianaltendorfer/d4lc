          EOF
          printf 'path=%s\n' "$notes_path" >> "$GITHUB_OUTPUT"
          printf 'package_version=%s\n' "$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      # A tag push publishes that tag. A manual run uses v<package version>,
      # which must already exist and point to the commit the run was started
      # on; the script refuses any mismatch and never creates or moves tags.
      - name: Create or refresh the draft GitHub Release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.package-linux-release.outputs.version) }}
          PACKAGE_VERSION: ${{ needs.package-linux-release.outputs.version }}
          PACKAGING_SUMMARY: ${{ steps.artifacts.outputs.packaging_summary }}
          NOTES_FILE: ${{ steps.release_notes.outputs.path }}
          TARBALL: ${{ steps.artifacts.outputs.tarball }}
          DEB_ARTIFACT: ${{ steps.artifacts.outputs.deb_artifact }}
          APPIMAGE_ARTIFACT: ${{ steps.artifacts.outputs.appimage_artifact }}
          SHA256SUMS: ${{ steps.artifacts.outputs.sha256sums }}
        run: |
          set -euo pipefail
          ./scripts/publish_draft_release.sh \
            --tag "$RELEASE_TAG" \
            --sha "$GITHUB_SHA" \
            --version "$PACKAGE_VERSION" \
            --summary "$PACKAGING_SUMMARY" \
            --notes "$NOTES_FILE" \
            "$TARBALL" "$DEB_ARTIFACT" "$APPIMAGE_ARTIFACT" "$SHA256SUMS" "$PACKAGING_SUMMARY"
