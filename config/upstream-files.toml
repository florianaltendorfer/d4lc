[upstream]
url = "https://github.com/josdemmers/Diablo4Companion.git"
branch = "master"
local_path = "upstream/Diablo4Companion"

[critical_files]
services = [
  "D4Companion.Services/ScreenProcessHandler.cs",
  "D4Companion.Services/OcrHandler.cs",
  "D4Companion.Services/ScreenCaptureHandler.cs",
  "D4Companion.Services/SystemPresetManager.cs",
  "D4Companion.Services/SettingsManager.cs",
  "D4Companion.Services/AffixManager.cs",
  "D4Companion.Services/OverlayHandler.cs",
  "D4Companion.Services/TradeItemManager.cs",
  "D4Companion.Services/BuildsManagerD4Builds.cs",
  "D4Companion.Services/BuildsManagerMaxroll.cs",
  "D4Companion.Services/BuildsManagerMobalytics.cs",
  "D4Companion.Services/BuildsManagerD2Core.cs",
]
entities = [
  "D4Companion.Entities/SettingsD4.cs",
  "D4Companion.Entities/ItemTooltipDescriptor.cs",
  "D4Companion.Entities/OcrResults.cs",
  "D4Companion.Entities/AffixPreset.cs",
  "D4Companion.Entities/ParagonBoard.cs",
]
data_globs = [
  "D4Companion/Data/*.json",
]
# The upstream UI images the port vendors byte-identically under
# assets/original/images (the Affix screen's slot, class, website, overlay and
# filter-strip icons). Listed explicitly so the manifest covers exactly the
# copied files the parity gate hashes.
